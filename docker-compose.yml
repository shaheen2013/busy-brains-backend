services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-p", "5446"]
    ports:
      - "${DB_PORT:-5446}:5446"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: 5446
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p 5446"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5446}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
